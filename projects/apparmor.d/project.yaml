# apparmor.d: full set of AppArmor profiles, defining the MAC policy of a whole
# Linux system (systemd, D-Bus, desktop environments, services, applications).
repo: https://github.com/roddhjav/apparmor.d#main
primary_contact: security@pujol.io
homepage: https://apparmor.pujol.io
disabled: false
dockerfile: .oss-scanner/Dockerfile
threat_model: .oss-scanner/threat_model.md
report_guidelines: .oss-scanner/report_guidelines.md
patch_guidelines: .oss-scanner/patch_guidelines.md
output_format:
  email:
    min_severity: low
  github_security_advisory:
    min_severity: none
