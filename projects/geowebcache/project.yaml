# REQUIRED. The ONE git repository to scan, as an https:// URL. Optionally add #branch or #tag to pin one.
repo: https://github.com/GeoWebCache/geowebcache#main

# REQUIRED. Who should we email our reports to, and use as the primary contact for questions.
primary_contact: geoserver-security@lists.osgeo.org

# Optional. The project's home page.
homepage: https://geowebcache.osgeo.org

# Optional. true pauses reports without removing the enrolment; false (or omitting it) enables your project.
disabled: false

# Both files live in the GeoWebCache repository, so the GWC PSC can change them without a pull request here.
dockerfile: build/.oss-scanner/Dockerfile
threat_model: build/.oss-scanner/threat_model.md
