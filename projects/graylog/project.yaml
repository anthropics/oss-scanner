# Graylog Open (graylog2-server): log management server, web interface and Data Node.

# REQUIRED. The ONE git repository to scan, as an https:// URL. Optionally add #branch or #tag to pin one.
repo: https://github.com/Graylog2/graylog2-server#master

# REQUIRED. Who should we email our reports to, and use as the primary contact for questions.
# This is the reporting address published in the repository's SECURITY.md.
primary_contact: security@graylog.com

# Optional. Additional email addresses we will CC on disclosure reports.
# auto_ccs:
#   - someone@graylog.com

# Optional. The project's home page.
homepage: https://graylog.org

# Optional. The lowest severity each channel receives: low, medium, high, critical, or none to turn it off.
output_format:
  email:
    min_severity: high
  github_security_advisory:
    min_severity: low

# Optional. true pauses reports without removing the enrolment; false (or omitting it) enables your project.
disabled: false

# The build, threat model and guidelines live in the repository above, so they can change with the code.
dockerfile: .oss-scanner/Dockerfile
threat_model: .oss-scanner/threat_model.md
report_guidelines: .oss-scanner/report_guidelines.md
patch_guidelines: .oss-scanner/patch_guidelines.md
