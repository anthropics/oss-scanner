# Formbricks — open-source experience management: surveys, feedback from other tools,
# AI analysis, dashboards and workflows, run in your own infrastructure next to your
# own data. https://formbricks.com | https://github.com/formbricks/formbricks
#
# The platform is multi-tenant and internet-facing by design. Public link surveys, the
# JS SDK and embedded surveys collect responses from anonymous visitors; the REST APIs
# and SSO/SAML endpoints take untrusted input; and what they collect is customer PII.
# Public-sector, healthcare, financial-services and market-research teams self-host it,
# so a flaw can expose tenant data on infrastructure its maintainers do not operate.
repo: https://github.com/formbricks/formbricks#main

primary_contact: security@formbricks.com
homepage: https://formbricks.com

dockerfile: .oss-scanner/Dockerfile
threat_model: .oss-scanner/threat_model.md
report_guidelines: .oss-scanner/report_guidelines.md
patch_guidelines: .oss-scanner/patch_guidelines.md
