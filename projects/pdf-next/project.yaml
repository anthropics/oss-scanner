# pdf-next: desktop PDF, image and Markdown viewer (Tauri 2; Rust backend, PDF.js in a
# webview), shipped through winget, an apt repository and GitHub releases. It opens
# files from anywhere, and a hostile file that takes over the webview can call the
# Rust commands that read files and launch programs.
