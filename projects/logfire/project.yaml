# Pydantic Logfire: the Python SDK for the Logfire observability platform, built on OpenTelemetry.

repo: https://github.com/pydantic/logfire#main

# Pydantic's security alias.
primary_contact: security@pydantic.dev

homepage: https://pydantic.dev/logfire

# Reports go by email only: the scanner must not open GitHub security advisories on the repository.
output_format:
  email:
    min_severity: low
  github_security_advisory:
    min_severity: none

disabled: false

# The Dockerfile and threat_model.md are next to this file, so dockerfile: and threat_model: are omitted.
