
# The official go-coap repository.
repo: https://github.com/plgd-dev/go-coap#master

# Replace with the project's public security contact.
# This address will receive vulnerability reports.
primary_contact: security@plgd.dev

# Optional: additional public security contacts.
# auto_ccs:
#   - ADDITIONAL_SECURITY_EMAIL

homepage: https://github.com/plgd-dev/go-coap

disabled: false

# Dockerfile and threat model are maintained in the upstream repository.
dockerfile: .oss-scanner/Dockerfile
threat_model: .oss-scanner/threat_model.md
# Initially receive reports by email.
output_format:
  email:
    min_severity: low
  github_security_advisory: # GitHub private vulnerability reporting
    min_severity: low
