# REQUIRED. The ONE git repository to scan, as an https:// URL. Optionally add #branch or #tag to pin one.
repo: https://github.com/EUDIPLO/eudiplo#main

# REQUIRED. Who should we email our reports to, and use as the primary contact for questions.
# This address is public. It is the email contact from SECURITY.md.
primary_contact: security@lists.lfdecentralizedtrust.org

# Optional. Additional email addresses we will CC on disclosure reports. Public as well.
# auto_ccs:
#   - maintainer@example.org

# Optional. The project's home page.
homepage: https://eudiplo.dev

# Optional. The lowest severity each channel receives: low, medium, high, critical, or none to turn it off.
# Findings go to GitHub private vulnerability reporting, the preferred channel in SECURITY.md, and not
# to the mailing list. The oss-scanner GitHub account must be a trusted reporter on EUDIPLO/eudiplo.
output_format:
  email:
    min_severity: none
  github_security_advisory:
    min_severity: low

# Optional. true pauses reports without removing the enrolment.
disabled: false

# The Dockerfile and the threat model live in the EUDIPLO repository.
dockerfile: .oss-scanner/Dockerfile
threat_model: .oss-scanner/threat_model.md
